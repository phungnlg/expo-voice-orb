  const fs = `precision highp float;

varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

// Colors from design system
const vec3 COLOR_INDIGO_GLOW = vec3(0.2627, 0.3804, 0.9333); // #4361EE
const vec3 COLOR_AQUA_GLOW = vec3(0.0784, 0.7216, 0.6510);   // #14B8A6
const vec3 COLOR_INDIGO_PARTICLE = vec3(0.5765, 0.6510, 1.0); // #93A6FF

float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

void main() {
    vec2 uv = v_texCoord * 2.0 - 1.0;
    uv.x *= u_resolution.x / u_resolution.y;
    
    float dist = length(uv);
    float t = u_time * 0.5;
    
    // Base glow
    vec3 color = mix(COLOR_INDIGO_GLOW, COLOR_AQUA_GLOW, uv.y * 0.5 + 0.5) * 0.15;
    float glow = 0.4 / (dist + 0.4);
    color *= glow;
    
    // Waveform Ring
    float radius = 0.5;
    float thickness = 0.015;
    float angle = atan(uv.y, uv.x);
    
    // Multiple octaves of noise for fluid motion
    float wave = sin(angle * 3.0 + t) * 0.05;
    wave += sin(angle * 5.0 - t * 0.8) * 0.03;
    wave += sin(angle * 2.0 + t * 1.2) * 0.02;
    
    float ringDist = abs(dist - (radius + wave));
    float ringGlow = exp(-ringDist * 40.0);
    color += mix(COLOR_INDIGO_GLOW, COLOR_AQUA_GLOW, sin(angle + t) * 0.5 + 0.5) * ringGlow;
    
    // Particles
    for(int i = 0; i < 40; i++) {
        float fi = float(i);
        float pAngle = fi * 137.5 + t * 0.1;
        float pDist = 0.3 + 0.4 * hash(vec2(fi, 1.0)) + 0.1 * sin(t + fi);
        vec2 pPos = vec2(cos(pAngle), sin(pAngle)) * pDist;
        
        float pSize = 0.002 + 0.005 * hash(vec2(fi, 2.0));
        float pGlow = pSize / length(uv - pPos);
        
        vec3 pCol = (hash(vec2(fi, 3.0)) > 0.85) ? COLOR_AQUA_GLOW : COLOR_INDIGO_PARTICLE;
        color += pCol * pow(pGlow, 1.5) * (0.5 + 0.5 * sin(t + fi * 1.5));
    }
    
    // Soft falloff
    color *= smoothstep(1.5, 0.0, dist);
    
    gl_FragColor = vec4(color, 1.0);

  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;

    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  }
  render(0);
})();
</script>
