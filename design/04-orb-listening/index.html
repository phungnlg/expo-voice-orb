    float t = u_time * 1.5; // Faster time for "Listening" state

    float asymmetry = smoothstep(-1.0, 1.0, cos(angle - t * 0.5)) * 0.15 * amp;

    float ringGlow = exp(-ringDist * 45.0);

    for(int i = 0; i < 45; i++) {

        float pDist = 0.4 + 0.5 * hash(vec2(fi, 1.0)) + burst + 0.05 * sin(t * 2.0 + fi);

        float pSize = 0.002 + 0.005 * hash(vec2(fi, 2.0));
        float pGlow = pSize / length(uv - pPos);

        float blink = smoothstep(0.2, 0.8, sin(t * 3.0 + fi * 3.0) * 0.5 + 0.5);
        color += COLOR_ACCENT_DARK * pow(pGlow, 1.4) * 0.6 * blink;

    color *= smoothstep(1.3, 0.0, dist);
