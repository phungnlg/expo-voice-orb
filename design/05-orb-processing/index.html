<script>
        // Simple subtle value animation for the amplitude
        document.addEventListener('DOMContentLoaded', () => {
            const ampDisplay = document.querySelector('.font-numeral-data');
            
            setInterval(() => {
                // Generate a slightly fluctuating value around 0.80 - 0.95
                const baseVal = 0.85;
                const jitter = (Math.random() * 0.1) - 0.05;
                const finalVal = (baseVal + jitter).toFixed(2);
                
                if(ampDisplay) {
                    ampDisplay.textContent = `amp ${finalVal}`;
                }
            }, 400); // update every 400ms to feel responsive but not erratic
        });
    </script>
