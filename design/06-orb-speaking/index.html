const vec3 COLOR_AQUA = vec3(0.0784, 0.7216, 0.6510);   // #14B8A6
const vec3 COLOR_ACCENT_DARK = vec3(0.5765, 0.6510, 1.0); // #93A6FF

float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

void main() {
    vec2 uv = v_texCoord * 2.0 - 1.0;
    uv.x *= u_resolution.x / u_resolution.y;
    
    float dist = length(uv);
    float t = u_time * 1.8; // High energy for speaking
    
    // Constant amplitude for "Speaking" state (0.71)
    float amp = 0.71 + sin(t * 4.0) * 0.08;
    
    vec3 color = vec3(0.0);
    
    // 1. Core soft glow - brightest state
    color += COLOR_INDIGO * 0.3 * exp(-dist * 1.0);
    
    // 2. Bold Fluid Waveform Ring
    float radius = 0.48;
    float angle = atan(uv.y, uv.x);
    
    // Multiple octaves of energetic waves
    float wave = sin(angle * 4.0 + t * 2.0) * 0.12 * amp;
    wave += sin(angle * 8.0 - t * 1.5) * 0.06 * amp;
    wave += cos(angle * 12.0 + t * 3.0) * 0.03;

    float ringDist = abs(dist - (radius + wave));
    float ringGlow = exp(-ringDist * 40.0);

    vec3 ringColor = mix(COLOR_INDIGO, COLOR_AQUA, sin(angle + t) * 0.5 + 0.5);
    color += ringColor * ringGlow * 1.8 * (0.8 + 0.2 * sin(t * 5.0));

    for(int i = 0; i < 50; i++) {
        float fi = float(i);
        float pAngle = fi * 137.5 + t * 0.1;
        
        // Particles pulse outward based on amplitude
        float speed = 0.5 + hash(vec2(fi, 1.0)) * 0.5;
        float pDist = mod(t * speed + hash(vec2(fi, 2.0)), 1.2);
        
        // Fade out as they move away from center
        float pAlpha = smoothstep(1.2, 0.4, pDist) * smoothstep(0.0, 0.2, pDist);
        
        vec2 pPos = vec2(cos(pAngle), sin(pAngle)) * pDist;
        float pSize = 0.002 + 0.004 * hash(vec2(fi, 3.0));
        float pGlow = pSize / length(uv - pPos);
        
        color += COLOR_ACCENT_DARK * pow(pGlow, 1.4) * pAlpha * 0.8;
    }
    
    // Falloff to match page background #0E0E16
    color *= smoothstep(1.4, 0.0, dist);
    
    gl_FragColor = vec4(color, 1.0);
