<style>
        body {
            background-color: #0E0E16; /* Fallback */
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(23, 23, 34, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Orb Animation Styles Placeholder */
        .orb-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orb-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(147, 166, 255, 0.4) 0%, rgba(147, 166, 255, 0) 70%);
            animation: pulse-glow 2s ease-in-out infinite alternate;
        }
        .orb-core {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #93A6FF, #4361EE);
            box-shadow: 0 0 20px rgba(147, 166, 255, 0.6);
            position: relative;
            z-index: 10;
        }
        
        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Fluid Ring Simulation */
        .fluid-ring {
            position: absolute;
            width: 90px;
            height: 90px;
            border: 2px solid rgba(147, 166, 255, 0.8);
            border-radius: 40% 60% 60% 40% / 40% 50% 50% 60%;
            animation: rotate-ring 8s linear infinite;
        }
        .fluid-ring:nth-child(2) {
            width: 85px;
            height: 85px;
            border: 2px solid rgba(147, 166, 255, 0.4);
            border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
            animation: rotate-ring-reverse 6s linear infinite;
        }

        @keyframes rotate-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotate-ring-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-text-primary min-h-screen flex flex-col pt-top-inset pb-bottom-inset selection:bg-primary-container selection:text-text-primary">
<!-- TopAppBar JSON Translated -->
<header class="fixed top-0 w-full flex justify-between items-center px-edge-margin h-top-inset z-50 bg-background transition-opacity duration-300">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 0;">blur_on</span>
<span class="font-wordmark-caps text-wordmark-caps text-text-primary tracking-widest">LUMEN</span>
</div>
<div class="flex items-center bg-surface-inset border border-border-hairline rounded-full px-3 py-1">
<span class="font-label-14 text-label-14 text-accent-dark">Listening</span>
</div>
</header>
<main class="flex-1 px-edge-margin flex flex-col gap-8 pb-24 overflow-y-auto">
<!-- Orb Section -->
<section class="mt-8 flex flex-col items-center justify-center">
<div class="orb-container">
<div class="orb-glow"></div>
<div class="fluid-ring"></div>
<div class="fluid-ring"></div>
<div class="orb-core"></div>
</div>
<p class="mt-6 font-caption-13 text-caption-13 text-text-secondary uppercase tracking-widest">Live State</p>
</section>
<!-- Triggers Grid -->

<div class="grid grid-cols-2 gap-3">
<button class="bg-surface border border-border-hairline rounded-lg py-3 px-4 flex items-center justify-center font-label-14 text-label-14 text-text-secondary hover:border-outline-variant transition-colors">Idle</button>
<button class="bg-surface border border-border-hairline rounded-lg py-3 px-4 flex items-center justify-center font-label-14 text-label-14 text-text-secondary hover:border-outline-variant transition-colors">Activated</button>
<button class="bg-[rgba(147,166,255,0.14)] border border-[rgba(147,166,255,0.3)] rounded-lg py-3 px-4 flex items-center justify-center font-label-14 text-label-14 text-accent-dark">Listening</button>
<button class="bg-surface border border-border-hairline rounded-lg py-3 px-4 flex items-center justify-center font-label-14 text-label-14 text-text-secondary hover:border-outline-variant transition-colors">Processing</button>
