<style>
        body { background-color: #0E0E16; color: #EAEAF5; }
        .slider-thumb::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #EAEAF5;
            cursor: pointer;
        }
        .toggle-checkbox:checked {
            background-color: #93A6FF;
            border-color: #93A6FF;
        }
        .toggle-checkbox:checked::after {
            transform: translateX(100%);
            border-color: #93A6FF;
        }
        .toggle-checkbox::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background antialiased min-h-screen flex flex-col pb-[100px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-edge-margin h-[top-inset] w-full z-50 bg-background transition-opacity duration-300">
<div class="flex items-center gap-2 text-text-primary">
<span class="material-symbols-outlined text-primary">blur_on</span>
<span class="font-wordmark-caps text-wordmark-caps tracking-widest text-text-primary">LUMEN</span>
</div>
<div class="bg-accent/10 px-3 py-1 rounded-full border border-accent/20">
<span class="font-label-14 text-label-14 text-accent-dark">Idle</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-edge-margin mt-8 flex flex-col gap-8">
<!-- Header -->
<h1 class="font-display-32 text-display-32 text-text-primary">Settings</h1>
<!-- Performance Section -->
<section class="flex flex-col gap-4">
<h2 class="font-title-20 text-title-20 text-text-secondary">Performance</h2>
<div class="bg-surface border border-border-hairline rounded-xl overflow-hidden flex flex-col">
<!-- Slider Row -->
<div class="bg-surface-inset p-4 flex flex-col gap-3 border-b border-border-hairline">
<div class="flex justify-between items-center">
<span class="font-body-16 text-body-16 text-text-primary">Particle count</span>
<span class="font-numeral-data text-numeral-data text-accent-dark">240</span>
</div>
<div class="relative w-full h-2 bg-surface-inset rounded-full overflow-hidden border border-border-hairline">
<div class="absolute top-0 left-0 h-full bg-accent-dark w-[60%] rounded-full"></div>
</div>
</div>
<!-- FPS Toggle Row -->
<div class="bg-surface-inset p-4 flex justify-between items-center border-b border-border-hairline">
<span class="font-body-16 text-body-16 text-text-primary">Show FPS overlay</span>
<div class="flex items-center gap-4">
<span class="font-numeral-data text-numeral-data text-accent-dark drop-shadow-[0_0_8px_rgba(147,166,255,0.4)]">59.8 fps</span>
<div class="relative inline-block w-10 h-6 align-middle select-none">
<input checked="" class="toggle-checkbox absolute block w-10 h-6 rounded-full bg-surface-inset border border-border-hairline appearance-none cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
<!-- Reduce Motion Toggle Row -->
<div class="bg-surface-inset p-4 flex justify-between items-center">
<span class="font-body-16 text-body-16 text-text-primary">Reduce motion</span>
<div class="relative inline-block w-10 h-6 align-middle select-none">
<input class="toggle-checkbox absolute block w-10 h-6 rounded-full bg-surface-inset border border-border-hairline appearance-none cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
</section>
<!-- Feedback Section -->
<section class="flex flex-col gap-4">
<h2 class="font-title-20 text-title-20 text-text-secondary">Feedback</h2>
<div class="bg-surface border border-border-hairline rounded-xl overflow-hidden">
<div class="bg-surface-inset p-4 flex justify-between items-center">
<span class="font-body-16 text-body-16 text-text-primary">Haptics</span>
<div class="relative inline-block w-10 h-6 align-middle select-none">
<input checked="" class="toggle-checkbox absolute block w-10 h-6 rounded-full bg-surface-inset border border-border-hairline appearance-none cursor-pointer" type="checkbox"/>
</div>
</div>
</div>
</section>
<!-- About Section -->
<section class="flex flex-col gap-4">
<h2 class="font-title-20 text-title-20 text-text-secondary">About</h2>
<div class="bg-surface border border-border-hairline rounded-xl overflow-hidden cursor-pointer hover:bg-surface-inset transition-colors">
<div class="bg-surface-inset p-4 flex justify-between items-center">
<span class="font-body-16 text-body-16 text-text-primary">Lumen Orb Lab v0.1.0</span>
<span class="material-symbols-outlined text-text-hint">chevron_right</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full h-[bottom-inset] flex justify-around items-center px-edge-margin bg-surface border-t border-border-hairline z-50 pt-2 pb-6">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">radio_button_checked</span>
<span class="font-label-14 text-[10px]">Orb</span>
</div>
<div class="flex flex-col items-center justify-center gap-1 text-text-hint hover:text-primary transition-colors cursor-pointer w-16">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">tune</span>
<span class="font-label-14 text-[10px]">Lab</span>
</div>

<span class="font-label-14 text-[10px]">Settings</span>
